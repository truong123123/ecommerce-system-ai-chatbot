server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: store-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/store_dev}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:7200000}

app:
  cookie:
    secure: ${APP_COOKIE_SECURE:false}

vnpay:
  tmnCode: ${VNPAY_TMN_CODE:}
  hashSecret: ${VNPAY_HASH_SECRET:}
  url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
  health:
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:false}

llm:
  provider: ${LLM_PROVIDER:gemini}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:gemini-1.5-flash}
  connect-timeout-seconds: ${LLM_CONNECT_TIMEOUT_SECONDS:3}
  read-timeout-seconds: ${LLM_READ_TIMEOUT_SECONDS:20}
  rate-limit:
    per-minute: ${LLM_RATE_LIMIT_PER_MINUTE:10}
    per-day: ${LLM_RATE_LIMIT_PER_DAY:100}
    system-daily-limit: ${LLM_SYSTEM_DAILY_LIMIT:1000}


