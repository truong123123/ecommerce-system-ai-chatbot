spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/store_dev}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: false

app:
  review:
    rate-limit: 100
  cookie:
    secure: false

jwt:
  secret: c098d5f3a2b1c4e7890123456789abcdef0123456789abcdef0123456789abcdef
  expiration: 7200000

vnpay:
  tmnCode: TESTTMNCODE
  hashSecret: TEST_HASH_SECRET_KEY_FOR_TESTS_ONLY
  url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html

llm:
  provider: gemini
  api-key: test-api-key
  model: gemini-1.5-flash

