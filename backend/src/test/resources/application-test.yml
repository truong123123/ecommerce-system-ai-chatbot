spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/store_dev}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: false

app:
  review:
    rate-limit: 100
  cookie:
    secure: false

jwt:
  secret: c098d5f3a2b1c4e7890123456789abcdef0123456789abcdef0123456789abcdef
  expiration: 7200000

vnpay:
  tmnCode: TESTTMNCODE
  hashSecret: TEST_HASH_SECRET_KEY_FOR_TESTS_ONLY
  url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html

llm:
  provider: gemini
  api-key: test-api-key
  model: test-flash-model
  connect-timeout-seconds: 3
  read-timeout-seconds: 5
  cooldown-seconds: 300
  max-tool-rounds: 2
  fallback-models: ""
  log-retention-days: 30
  rate-limit:
    system-daily-limit: 200
    system-minute-limit: 8
    per-key-daily-limit: 30
    per-key-minute-limit: 5


