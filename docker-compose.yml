version: '3.8'

services:
  # 1. DATABASE SERVICE (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: store_postgres
    environment:
      POSTGRES_DB: storekit_db
      POSTGRES_USER: store_user
      POSTGRES_PASSWORD: store_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U store_user -d storekit_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. REDIS CACHE SERVICE
  redis:
    image: redis:7-alpine
    container_name: store_redis
    ports:
      - "6379:6379"

  # 3. BACKEND SERVICE (Java Spring Boot)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: store_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/storekit_db
      SPRING_DATASOURCE_USERNAME: store_user
      SPRING_DATASOURCE_PASSWORD: store_password
      SPRING_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # 4. FRONTEND SERVICE (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: store_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
