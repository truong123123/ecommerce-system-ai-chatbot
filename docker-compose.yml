services:
  # 1. DATABASE SERVICE (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: store_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - store_postgres_data:/var/lib/postgresql/data
    networks:
      - store_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. REDIS CACHE & RATE LIMITING SERVICE
  redis:
    image: redis:7-alpine
    container_name: store_redis
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}" ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - store_network
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2.1 PGADMIN (Chỉ chạy khi kích hoạt profile 'tools')
  pgadmin:
    profiles:
      - tools
    image: dpage/pgadmin4:latest
    container_name: store_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@store.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-store_admin_password}
    ports:
      - "127.0.0.1:5050:80"
    networks:
      - store_network
    depends_on:
      postgres:
        condition: service_healthy

  # 3. BACKEND SERVICE (Spring Boot 3.2)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: store_backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      MANAGEMENT_HEALTH_REDIS_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    networks:
      - store_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. FRONTEND SERVICE (Next.js 14 Standalone)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8080/api/v1}
    container_name: store_frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8080/api/v1}
    networks:
      - store_network
    depends_on:
      backend:
        condition: service_healthy

volumes:
  store_postgres_data:
    name: store_postgres_data

networks:
  store_network:
    name: store_network
    driver: bridge
